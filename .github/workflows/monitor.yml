name: Site Monitor

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (use "*/30 * * * *" for a private repo to save minutes)
  workflow_dispatch:
    inputs:
      test_email:
        description: "Only send a test email"
        type: boolean
        default: false

permissions:
  contents: write              # needed to save state.json back to the repo

concurrency:
  group: site-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
        run: python3 monitor.py

      # Runs even if the monitor step failed (e.g. an email could not be sent),
      # so state is never lost. Skipped for test-email runs.
      - name: Save state
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.test_email) }}
        run: |
          git config user.name "site-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "Update monitor state [skip ci]"
          for attempt in 1 2 3; do
            # -X theirs keeps OUR new state.json if the file changed remotely meanwhile
            git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep 5
          done
          echo "Could not push state.json after 3 attempts"
          exit 1
